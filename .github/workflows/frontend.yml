name: "Deploy Frontend"

on:
    push:
        branches: ["main"]
        paths: ["src/**"]
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Azure Login via OIDC
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Get SWA Deployment Token
              id: get-token
              run: |
                  # Dynamically fetch the token using Azure CLI
                  TOKEN=$(az staticwebapp secrets list --name "swa-f1-tracker-2053" --resource-group "rg-f1-tracker-app" --query "properties.apiKey" -o tsv)
                  echo "SWA_TOKEN=$TOKEN" >> $GITHUB_ENV

            - name: Deploy to Static Web Apps
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: "upload"
                  app_location: "./src" # Where our HTML/JS lives
                  api_location: "" # We are hosting APIs separately in Azure Functions
                  output_location: "" # No build step (like React/npm) required for plain HTML
